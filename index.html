<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test AI Partita Doppia</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#0b1220;
      color:#e8eefc;
      padding:20px;
    }
    .box{
      max-width:800px;
      margin:0 auto;
      background:#111a2e;
      border:1px solid #24314f;
      border-radius:16px;
      padding:16px;
    }
    textarea{
      width:100%;
      min-height:120px;
      margin-top:10px;
      border-radius:12px;
      border:1px solid #314061;
      background:#0b1220;
      color:#e8eefc;
      padding:12px;
      box-sizing:border-box;
      font-size:16px;
    }
    button{
      margin-top:10px;
      background:#4f7cff;
      color:white;
      border:none;
      border-radius:12px;
      padding:12px 18px;
      font-size:16px;
      cursor:pointer;
    }
    .out{
      margin-top:16px;
      padding:12px;
      border-radius:12px;
      background:#0b1220;
      border:1px solid #263553;
      white-space:pre-wrap;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Test analisi</h1>
    <textarea id="consegna" placeholder="Scrivi una consegna facile, ad esempio: acquisto di merci con fattura"></textarea>
    <br>
    <button id="analizzaBtn">Analizza consegna</button>
    <div id="output" class="out">Nessun risultato ancora.</div>
  </div>

  <script>
    const btn = document.getElementById('analizzaBtn');
    const out = document.getElementById('output');
    const txt = document.getElementById('consegna');

    btn.addEventListener('click', () => {
      const text = txt.value.trim();
      if (!text) {
        out.textContent = 'Inserisci una consegna.';
        return;
      }

      out.textContent = 'Hai cliccato. Test riuscito.\n\nConsegna inserita:\n' + text;
      alert('click ok');
    });
  </script>
</body>
</html>
