<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test pulsanti</title>
<style>
body{font-family:Arial,sans-serif;background:#07111f;color:#e7eefc;padding:20px}
textarea,button{font-size:16px;border-radius:10px;border:1px solid #334565}
textarea{width:100%;min-height:160px;padding:12px;background:#081120;color:#fff}
button{padding:12px 16px;margin:6px 6px 6px 0;cursor:pointer}
#status,#out1,#out2,#out3{margin-top:12px;padding:12px;background:#081120;border:1px solid #334565;border-radius:10px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Test pulsanti</h1>

<textarea id="consegna" placeholder="Scrivi qui il testo da analizzare"></textarea>

<div>
  <button id="analizzaAiBtn" type="button">Analizza con AI</button>
  <button id="nuovaBtn" type="button">Nuova giornata</button>
  <button id="resetBtn" type="button">Azzera tutto</button>
</div>

<div id="status">Pronto.</div>
<div id="out1">Consegna: vuota</div>
<div id="out2">Mastrini: vuoti</div>
<div id="out3">Giornate: vuote</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const consegna = document.getElementById('consegna');
  const status = document.getElementById('status');
  const out1 = document.getElementById('out1');
  const out2 = document.getElementById('out2');
  const out3 = document.getElementById('out3');

  const LS_KEY = 'test_button_state_v1';

  function render() {
    const saved = JSON.parse(localStorage.getItem(LS_KEY) || '{"giornate":[],"mastrini":{}}');
    out1.textContent = 'Consegna: ' + (consegna.value || 'vuota');
    out2.textContent = 'Mastrini: ' + Object.keys(saved.mastrini).length + ' conti salvati';
    out3.textContent = 'Giornate: ' + saved.giornate.length + ' salvate';
  }

  document.getElementById('analizzaAiBtn').addEventListener('click', async () => {
    const text = consegna.value.trim();
    if (!text) {
      status.textContent = 'Inserisci prima un testo nella consegna.';
      return;
    }

    status.textContent = 'Invio alla funzione AI...';

    try {
      const res = await fetch('/.netlify/functions/ping', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: text })
      });

      const raw = await res.text();
      status.textContent = `HTTP ${res.status} - ${raw}`;
    } catch (e) {
      status.textContent = 'Errore di rete: ' + e.message;
    }

    render();
  });

  document.getElementById('nuovaBtn').addEventListener('click', () => {
    consegna.value = '';
    status.textContent = 'Nuova giornata: solo consegna cancellata.';
    render();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    localStorage.removeItem(LS_KEY);
    consegna.value = '';
    status.textContent = 'Azzera tutto: dati cancellati.';
    render();
  });

  render();
});
</script>
</body>
</html>
